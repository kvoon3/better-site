<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better Site — URL playground</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --panel: #141417;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --line: #27272a;
        --accent: #86efac;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(60rem 40rem at 20% -10%, #1c2b22, transparent), var(--bg);
        color: var(--fg);
        font: 14px/1.5 var(--sans);
        padding: 48px 20px;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 28px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--fg);
        font: 13px var(--mono);
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        background: #1c2b22;
        color: var(--accent);
        font: 600 13px var(--sans);
        cursor: pointer;
      }
      .samples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 28px;
      }
      .samples button {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: 11px var(--mono);
      }
      .samples button:hover {
        color: var(--fg);
        border-color: #3f3f46;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      }
      section {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(20, 20, 23, 0.75);
        padding: 16px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      dl {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 6px 12px;
        margin: 0;
      }
      dt {
        color: var(--muted);
        font-size: 12px;
      }
      dd {
        margin: 0;
        font: 12px var(--mono);
        word-break: break-all;
      }
      .alt {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px;
        border-radius: 10px;
        background: #101013;
        margin-bottom: 8px;
      }
      .alt a {
        color: var(--accent);
        font: 12px var(--mono);
        word-break: break-all;
      }
      .alt .none {
        color: #fca5a5;
        font-size: 12px;
      }
      .state {
        color: var(--muted);
        font: 12px var(--mono);
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Better Site</h1>
      <p class="sub">Paste any GitHub / DiffsHub / npm / npmx URL. See how it maps to the other surface, including file/line state.</p>
      <div class="row">
        <input id="url" spellcheck="false" autocomplete="off" />
        <button id="go" type="button">Parse</button>
      </div>
      <div class="samples" id="samples"></div>
      <div class="grid">
        <section>
          <h2>Parsed surface</h2>
          <dl id="surface"></dl>
          <div class="state" id="state"></div>
        </section>
        <section>
          <h2>Other surfaces</h2>
          <div id="alternates"></div>
        </section>
      </div>
    </main>
    <script src="demo.js"></script>
  </body>
</html>
